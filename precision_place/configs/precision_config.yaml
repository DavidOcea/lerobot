# 精准放置配置
# 注意: 此文件仅为遗留配置，当前活跃代码使用 models/calibration_data.py 中的 ARM_CONFIGS
# 保留此文件是为了兼容 _archived 目录中的旧代码

# 相机
# 当前配置 (2024-04): 拆掉了两个相机
# - 右手相机: 索引4
# - 左手相机: 索引2
cameras:
  indices:
    head: 0
    left_wrist: 2
    right_wrist: 4
  primary: right_wrist  # 索引4

# 标记颜色
markers:
  workpiece_color: "green"  # 工件标记
  slot_color: "red"          # 卡槽标记

# 精度参数
precision:
  tolerance_mm: 2.0
  rotation_tolerance_deg: 2.0

# 视觉伺服参数
visual_servo:
  pixel_to_mm_ratio: 0.5
  gain: 0.6
  max_iterations: 15
  settle_time: 0.3

# 关节控制
joints:
  right_arm:
    x_joint: 7      # X方向
    y_joint: 8      # Y方向/高度
    x_sensitivity: 0.15
    y_sensitivity: 0.20
  height_step: 2.0
