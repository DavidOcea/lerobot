# Visual Alignment Test: station C → visual_align to marker → return to C
#
# 测试方案D: 站点导航粗定位 + AprilTag视觉精调
# 1. AGV导航到站点C (AP10, 粗定位 ±30cm)
# 2. 视觉搜索AprilTag标记并闭环微调 (精调 ±2cm)
# 3. 返回站点C
#
# 注意: 视觉精调只使用 "转向+前进/后退" 策略 (Seer AGV vy不生效)
# 标记应为10cm AprilTag (tag36h11), 贴在目标工位上

# ========== Named Positions ==========
named_positions:
  home:
    left_arm_joint_1: -40.3
    left_arm_joint_2: -4.0
    left_arm_joint_3: -0.5
    left_arm_joint_4: -58.6
    left_arm_joint_5: -2.0
    left_arm_joint_6: 11.8
    right_arm_joint_1: 40.3
    right_arm_joint_2: 4.0
    right_arm_joint_3: 0.8
    right_arm_joint_4: 58.6
    right_arm_joint_5: 2.0
    right_arm_joint_6: -11.8
    trunk_joint_1: 0.0
    trunk_joint_2: 0.0

# ========== AGV Global Configuration ==========
agv_config:
  enabled: true
  host: "192.168.2.210"
  port: 19204
  connection_timeout: 5.0
  read_timeout: 2.0
  auto_reconnect: true
  auto_disconnect_after_task: false
  emergency_stop_enabled: true
  check_arm_before_move: true
  station_map:
    station_A: [0.168, 0.029, 0.650]
    station_B: [5.0, 0.0, 0.0]
  default_arm_safe_positions:
    left_arm_joint_1: 5.0
    left_arm_joint_2: 5.0
    left_arm_joint_3: 5.0
    left_arm_joint_4: 5.0
    left_arm_joint_5: 5.0
    left_arm_joint_6: 5.0
    right_arm_joint_1: 5.0
    right_arm_joint_2: 5.0
    right_arm_joint_3: 5.0
    right_arm_joint_4: 5.0
    right_arm_joint_5: 5.0
    right_arm_joint_6: 5.0
    trunk_joint_1: 3.0
    trunk_joint_2: 3.0

# ========== Robot Configuration ==========
robot_config:
  type: "supre_robot_follower"
  control_frequency: 50
  prometheus_port: 8000
  max_relative_joint_move: 2.0
  joint_config_file: "trunk_config_supre_robot_joint.yaml"
  cameras:
    head_cam:
      type: opencv
      index: 0
      width: 640
      height: 480
      fps: 30

# ========== Collision Detection ==========
collision_config:
  collision_threshold: 2.0
  detection_window: 5
  adaptive_mode: true
  velocity_compensation: true
  auto_calibrate: true
  calibration_samples: 20

# ========== Monitoring ==========
monitoring_config:
  log_level: "INFO"
  enable_prometheus: false
  prometheus_port: 9090

# ========== Task Sequence ==========

tasks:
  # Step 1: 机械臂归位 (安全位置检查)
  - name: "arm_home_before_move"
    task_type: "position"
    max_duration: 10.0
    max_retries: 1
    enabled: true
    completion_criteria:
      type: "position"
      position: home
      position_tolerance: 3.0

  # Step 2: AGV导航到站点C (粗定位, ±30cm)
  - name: "agv_to_station_C"
    task_type: "agv"
    max_duration: 60.0
    max_retries: 2
    enabled: true
    agv_config:
      target_station: "AP10"
      wait_for_arrival: true
      arrival_timeout: 60.0
      arrival_tolerance: 0.3
      check_arm_safe_position: true
      retry_on_timeout: true
      retry_count: 2
      emergency_stop_on_error: true

  # Step 3: 视觉精调对准AprilTag标记 (粗定位±30cm → 精调±2cm)
  # 流程: 搜索标记 → 解算位姿 → 转向+前进 → 闭环验证
  - name: "visual_align_marker_C"
    task_type: "visual_align"
    max_duration: 30.0
    max_retries: 2
    enabled: true
    visual_align_config:
      marker_id: 0              # AprilTag ID=0 (站点C的标记)
      marker_size: 0.10         # 标记物理边长 10cm (0.10m)
      marker_family: "tag36h11" # AprilTag 家族
      search_turn_step: 10.0    # 搜索每步左转10°
      search_max_turn: 90.0     # 最大搜索范围90°
      search_max_attempts: 9    # 搜索步数 (90/10=9)
      position_tolerance: 0.02  # 位置收敛阈值 2cm
      angle_tolerance: 2.0      # 角度收敛阈值 2°
      max_iterations: 3         # 闭环最多3轮微调
      translate_speed: 0.15     # 前进微调速度 0.15m/s
      turn_speed: 15.0          # 转动微调速度 15°/s
      approach_distance: 0.50   # 停在标记前方50cm处
      camera_offset_x: 0.0      # 相机偏移 (先用0, 闭环收敛弥补)
      camera_offset_y: 0.0
      camera_offset_yaw: 0.0
      camera_offset_pitch: 45.0  # 相机俯视角度 (度, 正值=俯视朝下)

  # Step 4: 返回站点C
  - name: "agv_return_to_station_C"
    task_type: "agv"
    max_duration: 60.0
    max_retries: 2
    enabled: true
    agv_config:
      target_station: "AP10"
      wait_for_arrival: true
      arrival_timeout: 60.0
      arrival_tolerance: 0.3
      check_arm_safe_position: true
      retry_on_timeout: true
      retry_count: 2
      emergency_stop_on_error: true

# ========== Cycle Execution Settings ==========
max_cycles: 1
cycle_delay: 2.0
enable_cycle_prompt: true
environment_dt: 1.0 / 30.0
observation_timeout: 5.0
action_timeout: 5.0
reset_duration: 3.0
reset_positions: {}