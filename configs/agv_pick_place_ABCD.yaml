    agv_config:
      target_station: "LM7"
      wait_for_arrival: true
      arrival_timeout: 60.0
      arrival_tolerance: 0.3
      check_arm_safe_position: true
      retry_on_timeout: true
      retry_count: 2
      emergency_stop_on_error: true

  - name: "place_at_station_B2"
    task_type: "position_sequence"
    max_duration: 20.0
