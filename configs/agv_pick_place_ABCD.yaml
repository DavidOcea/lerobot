# ========== Cycle Execution Settings ==========
max_cycles: 5
cycle_delay: 3.0
enable_cycle_prompt: true
environment_dt: 1.0 / 30.0
observation_timeout: 5.0
action_timeout: 5.0
reset_duration: 3.0
reset_positions: {}

# ========== Monitoring Dashboard ==========
# Lightweight HTTP dashboard for real-time robot + AGV state visualization.
# Access at http://<robot-ip>:8080 after orchestrator starts.
# NOTE: Requires thread-safe AGV controller (seer_agv_controller.py with per-port locks).
#       Safe to enable after deploying the fix from commit on/after 2026-05-13.
enable_monitoring_dashboard: false
monitoring_dashboard_port: 8080
