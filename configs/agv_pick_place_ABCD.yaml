        fps: 30
    completion_criteria:
      type: "composite"
      conditions:
        - type: "stability"
          stability_window: 5
          stability_tolerance: 0.05

  - name: "arm_home_after_pick_A2"
    task_type: "position"
    max_duration: 10.0
    max_retries: 1
    enabled: true
