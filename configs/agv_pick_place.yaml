# AGV + Robot Combined Task Configuration
#
# This configuration demonstrates a complete pick-move-place-return workflow:
# 1. Robot picks part at station A
# 2. Robot arm moves to safe position
# 3. AGV moves robot to station B
# 4. Robot places part at station B
# 5. Robot arm moves to safe position
# 6. AGV returns to station A (for next cycle)
#
# Cycle mode: Repeat the entire sequence multiple times
#
# The AGV uses pure TCP communication (no ROS2 required)
#
# NOTE: Gripper joints (joint_7) temporarily removed - will restore later

# ========== AGV Global Configuration ==========
agv_config:
  enabled: true
  host: "192.168.1.100"  # AGV IP address - change to your AGV's IP
  port: 19204  # Default status query port
  connection_timeout: 5.0  # Seconds
  read_timeout: 2.0  # Seconds

  # Connection management
  auto_reconnect: true  # Auto-reconnect on connection loss
  auto_disconnect_after_task: false  # Keep connection after tasks complete

  # Safety settings
  emergency_stop_enabled: true
  check_arm_before_move: true  # Check arm position before AGV moves

  # Station map (optional - for coordinate-based navigation)
  # Format: station_id: [x, y, theta] (meters, radians)
  station_map:
    station_A: [0.0, 0.0, 0.0]
    station_B: [5.0, 0.0, 0.0]
    station_C: [10.0, 0.0, 0.0]
    station_home: [2.5, 2.5, 0.0]
    charging_station: [0.0, 5.0, 0.0]

# ========== Robot Configuration ==========
robot_config:
  type: "supre_robot_follower"

  # Robot connection settings
  serial_port: "/dev/ttyUSB0"  # Adjust to your setup
  control_frequency: 30.0  # Hz

  # Force sensing
  force_sensing_enabled: true

  # Cameras (optional - add as needed)
  cameras:
    head_cam:
      type: "opencv"
      index: 0
      width: 640
      height: 480
      fps: 30

# ========== Collision Detection Configuration ==========
collision_config:
  collision_threshold: 2.0  # Nm - force threshold for collision detection
  detection_window: 5  # Number of samples to analyze
  adaptive_mode: true  # Adjust thresholds based on velocity
  velocity_compensation: true  # Compensate for velocity-induced forces
  auto_calibrate: true  # Auto-calibrate base torques at startup
  calibration_samples: 20  # Number of samples for calibration

# ========== Monitoring Configuration ==========
monitoring_config:
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  enable_prometheus: false  # Prometheus metrics (optional)
  prometheus_port: 9090

# ========== Task Sequence ==========
# Pick at Station A -> AGV Move to Station B -> Place at Station B
# NOTE: Gripper joints removed - 12 arm joints + 2 trunk joints = 14 total

tasks:
  # ---------- Phase 1: Pick at Station A ----------
  - name: "pick_at_station_A"
    task_type: "policy"
    policy_path: "/path/to/act_pick_policy"  # CHANGE to your policy path
    policy_type: "act"
    max_duration: 25.0  # Maximum pick time (seconds)
    max_retries: 2  # Retry attempts if pick fails
    enabled: true

    completion_criteria:
      type: "stability"  # Position stability for pick completion
      stability_window: 5  # Check 5 consecutive samples
      stability_tolerance: 0.01  # rad - position stability
      # NOTE: Gripper force check disabled - gripper temporarily removed
      # conditions:
      #   - type: "force"
      #     joint_name: "left_arm_joint_7"  # Gripper joint
      #     force_threshold: 0.8  # Nm - grip confirmation

    cameras:
      - name: "head_cam"
        type: "opencv"
        index: 0
        width: 640
        height: 480
        fps: 30

  # ---------- Phase 2: Robot Arm Home Position (Safety) ----------
  # IMPORTANT: Move arm to safe position before AGV movement
  # Recommended values from /root/workspace/dc_dir/0420.log
  # NOTE: Gripper joints (joint_7) commented out - temporarily removed
  - name: "arm_home_position"
    task_type: "policy"
    policy_path: "/path/to/act_home_policy"  # CHANGE to your home policy
    policy_type: "act"
    max_duration: 10.0
    max_retries: 1
    enabled: true

    completion_criteria:
      type: "position"
      target_joint_positions:
        # Left Arm - home position (degrees) - 6 joints (gripper removed)
        left_arm_joint_1: -40.3
        left_arm_joint_2: -4.0
        left_arm_joint_3: -0.5
        left_arm_joint_4: -58.6
        left_arm_joint_5: -2.0
        left_arm_joint_6: 11.8
        # left_arm_joint_7: 0.3  # Gripper - DISABLED (temporarily removed)
        # Right Arm - home position (degrees) - 6 joints (gripper removed)
        right_arm_joint_1: 40.3
        right_arm_joint_2: 4.0
        right_arm_joint_3: 0.8
        right_arm_joint_4: 58.6
        right_arm_joint_5: 2.0
        right_arm_joint_6: -11.8
        # right_arm_joint_7: 0.3  # Gripper - DISABLED (temporarily removed)
        # Trunk - centered position (degrees)
        trunk_joint_1: 0.0
        trunk_joint_2: 0.0
      position_tolerance: 3.0  # degrees (allow some tolerance for safety check)

  # ---------- Phase 3: AGV Move to Station B ----------
  - name: "agv_move_to_station_B"
    task_type: "agv"
    max_duration: 60.0
    max_retries: 2
    enabled: true

    agv_config:
      target_station: "station_B"  # Target station ID
      wait_for_arrival: true  # Wait until AGV arrives
      arrival_timeout: 60.0  # Maximum wait time (seconds)
      arrival_tolerance: 0.3  # Distance tolerance (meters)

      # Safety: Check arm position before AGV moves
      # Verify arm is near home position (max deviation from home)
      # NOTE: Gripper joints (joint_7) commented out - temporarily removed
      check_arm_safe_position: true
      arm_safe_positions:
        # Left Arm - Max absolute deviation from home position (degrees)
        left_arm_joint_1: 5.0   # Home: -40.3, allow ±5°
        left_arm_joint_2: 5.0   # Home: -4.0
        left_arm_joint_3: 5.0   # Home: -0.5
        left_arm_joint_4: 5.0   # Home: -58.6
        left_arm_joint_5: 5.0   # Home: -2.0
        left_arm_joint_6: 5.0   # Home: 11.8
        # left_arm_joint_7: 0.5  # Gripper - DISABLED (temporarily removed)
        # Right Arm - Max absolute deviation from home position (degrees)
        right_arm_joint_1: 5.0  # Home: 40.3
        right_arm_joint_2: 5.0  # Home: 4.0
        right_arm_joint_3: 5.0  # Home: 0.8
        right_arm_joint_4: 5.0  # Home: 58.6
        right_arm_joint_5: 5.0  # Home: 2.0
        right_arm_joint_6: 5.0  # Home: -11.8
        # right_arm_joint_7: 0.5  # Gripper - DISABLED (temporarily removed)
        # Trunk - Max deviation (degrees)
        trunk_joint_1: 3.0      # Home: 0.0
        trunk_joint_2: 3.0      # Home: 0.0

      # Error handling
      retry_on_timeout: true
      retry_count: 2
      emergency_stop_on_error: true

  # ---------- Phase 4: Place at Station B ----------
  - name: "place_at_station_B"
    task_type: "policy"
    policy_path: "/path/to/act_place_policy"  # CHANGE to your policy
    policy_type: "act"
    max_duration: 20.0
    max_retries: 2
    enabled: true

    completion_criteria:
      type: "stability"  # Position stability after release
      stability_window: 10
      stability_tolerance: 0.005

    cameras:
      - name: "head_cam"
        type: "opencv"
        index: 0
        width: 640
        height: 480
        fps: 30

  # ---------- Phase 5: Robot Arm Home Position (Safety) ----------
  # IMPORTANT: Move arm to safe position before AGV returns to A
  # Recommended values from /root/workspace/dc_dir/0420.log
  # NOTE: Gripper joints (joint_7) commented out - temporarily removed
  - name: "arm_home_after_place"
    task_type: "policy"
    policy_path: "/path/to/act_home_policy"  # CHANGE to your home policy
    policy_type: "act"
    max_duration: 10.0
    max_retries: 1
    enabled: true

    completion_criteria:
      type: "position"
      target_joint_positions:
        # Left Arm - home position (degrees) - 6 joints (gripper removed)
        left_arm_joint_1: -40.3
        left_arm_joint_2: -4.0
        left_arm_joint_3: -0.5
        left_arm_joint_4: -58.6
        left_arm_joint_5: -2.0
        left_arm_joint_6: 11.8
        # left_arm_joint_7: 0.0  # Gripper - DISABLED (temporarily removed)
        # Right Arm - home position (degrees) - 6 joints (gripper removed)
        right_arm_joint_1: 40.3
        right_arm_joint_2: 4.0
        right_arm_joint_3: 0.8
        right_arm_joint_4: 58.6
        right_arm_joint_5: 2.0
        right_arm_joint_6: -11.8
        # right_arm_joint_7: 0.0  # Gripper - DISABLED (temporarily removed)
        # Trunk - centered position (degrees)
        trunk_joint_1: 0.0
        trunk_joint_2: 0.0
      position_tolerance: 3.0  # degrees

  # ---------- Phase 6: AGV Return to Station A ----------
  # Return to starting position for next cycle
  - name: "agv_return_to_station_A"
    task_type: "agv"
    max_duration: 60.0
    max_retries: 2
    enabled: true  # ENABLED for cycle mode

    agv_config:
      target_station: "station_A"  # Return to starting station
      wait_for_arrival: true
      arrival_timeout: 60.0
      arrival_tolerance: 0.3
      check_arm_safe_position: true
      # Safety check: verify arm is near home position (max deviation from home)
      # NOTE: Gripper joints (joint_7) commented out - temporarily removed
      arm_safe_positions:
        # Left Arm - Max absolute deviation from home position (degrees)
        left_arm_joint_1: 5.0   # Home: -40.3, allow ±5°
        left_arm_joint_2: 5.0   # Home: -4.0
        left_arm_joint_3: 5.0   # Home: -0.5
        left_arm_joint_4: 5.0   # Home: -58.6
        left_arm_joint_5: 5.0   # Home: -2.0
        left_arm_joint_6: 5.0   # Home: 11.8
        # left_arm_joint_7: 0.5  # Gripper - DISABLED (temporarily removed)
        # Right Arm - Max absolute deviation from home position (degrees)
        right_arm_joint_1: 5.0  # Home: 40.3
        right_arm_joint_2: 5.0  # Home: 4.0
        right_arm_joint_3: 5.0  # Home: 0.8
        right_arm_joint_4: 5.0  # Home: 58.6
        right_arm_joint_5: 5.0  # Home: 2.0
        right_arm_joint_6: 5.0  # Home: -11.8
        # right_arm_joint_7: 0.5  # Gripper - DISABLED (temporarily removed)
        # Trunk - Max deviation (degrees)
        trunk_joint_1: 3.0      # Home: 0.0
        trunk_joint_2: 3.0      # Home: 0.0
      retry_on_timeout: true
      retry_count: 2
      emergency_stop_on_error: true

# ========== Cycle Execution Settings ==========
# Configure how many times to repeat the entire task sequence
#
# max_cycles:
#   - 1: Execute once (default)
#   - N: Execute N times
#   - -1: Infinite loop (press Ctrl+C or 'q' to stop)
#
# cycle_delay: Seconds to wait between cycles
# enable_cycle_prompt: Ask user before each cycle (interactive mode)

max_cycles: 5          # Execute 5 cycles (pick-move-place-return × 5)
cycle_delay: 3.0       # Wait 3 seconds between cycles
enable_cycle_prompt: true  # Prompt user before each cycle
environment_dt: 1.0 / 30.0  # Control loop timestep
observation_timeout: 5.0  # Seconds
action_timeout: 5.0  # Seconds
reset_duration: 3.0  # Time to reset robot to zero position
reset_positions: {}  # Custom reset positions (optional)

# ========== Usage Instructions ==========
#
# 1. Install dependencies:
#    pip install lerobot
#
# 2. Update paths:
#    - Change policy_path to your trained ACT models
#    - Change AGV host IP to your AGV's actual IP
#    - Update robot serial_port if needed
#
# 3. Run the task sequence:
#    python -m lerobot.scripts.run_task_agent --config configs/agv_pick_place.yaml
#
# 4. Debug mode:
#    python -m lerobot.scripts.run_task_agent --config configs/agv_pick_place.yaml --debug
#
# 5. Interactive mode (prompt before each task):
#    python -m lerobot.scripts.run_task_agent --config configs/agv_pick_place.yaml --interactive
#
# 6. Run specific tasks only:
#    python -m lerobot.scripts.run_task_agent --config configs/agv_pick_place.yaml --tasks pick_at_station_A,agv_move_to_station_B