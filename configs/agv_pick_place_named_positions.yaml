# AGV + Robot Combined Task Configuration (Named Position Style)
#
# Optimized version of agv_pick_place_example.yaml using:
# 1. named_positions: Joint positions defined once, referenced by name
# 2. position_sequence: Multi-step tasks (approach → grip) as sub-steps
# 3. default_arm_safe_positions: AGV arm safety thresholds defined once
# 4. Explicit two sub-cycles per cycle (思路1: trunk angle varies between place D1 and D2)
#
# Behavior is identical to the original agv_pick_place_example.yaml.
# Each "big cycle" contains two sub-cycles:
#   Sub-cycle 1: pickup_C → place_D (trunk_2=45°)
#   Sub-cycle 2: pickup_C → place_D2 (trunk_2=38°)
# max_cycles repeats the entire sequence.

# ========== Named Positions ==========
# All reusable joint positions (14 joints: 6 left + 6 right + 2 trunk).
# Gripper joints (joint_7) temporarily removed.

named_positions:
  # --- Home positions ---
  home:
    left_arm_joint_1: -40.3
    left_arm_joint_2: -4.0
    left_arm_joint_3: -0.5
