    right_arm_joint_5: 2.0
    right_arm_joint_6: -10.0
    trunk_joint_1: 0.0
    trunk_joint_2: 45.0

  # --- Place at Station D2 (sub-cycle 2: trunk_2=38°) ---
  place_D2_approach:
    left_arm_joint_1: -52.3
    left_arm_joint_2: -2.0
    left_arm_joint_3: -0.5
