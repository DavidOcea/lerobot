# ========== AGV Global Configuration ==========
agv_config:
  enabled: true
  host: "192.168.2.210"
  port: 19204
  connection_timeout: 5.0
  read_timeout: 2.0
  auto_reconnect: true
  auto_disconnect_after_task: false
  emergency_stop_enabled: true
  check_arm_before_move: true

  station_map:
    station_A: [0.168, 0.029, 0.650]
    station_B: [5.0, 0.0, 0.0]

  # Default arm safe position thresholds (inherited by all AGV tasks)
  default_arm_safe_positions:
    left_arm_joint_1: 5.0
    left_arm_joint_2: 5.0
    left_arm_joint_3: 5.0
    left_arm_joint_4: 5.0
    left_arm_joint_5: 5.0
    left_arm_joint_6: 5.0
    right_arm_joint_1: 5.0
    right_arm_joint_2: 5.0
    right_arm_joint_3: 5.0
    right_arm_joint_4: 5.0
    right_arm_joint_5: 5.0
    right_arm_joint_6: 5.0
    trunk_joint_1: 3.0
    trunk_joint_2: 3.0

# ========== Robot Configuration ==========
robot_config:
  type: "supre_robot_follower"
  control_frequency: 50
  prometheus_port: 8000
  max_relative_joint_move: 2.0
  joint_config_file: "trunk_config_supre_robot_joint.yaml"
  cameras:
    head_cam:
      type: opencv
      index: 0
      width: 640
      height: 480
      fps: 30
    left_wrist_cam:
      type: opencv
      index: 2
      width: 640
      height: 480
      fps: 30
    right_wrist_cam:
      type: opencv
      index: 4
      width: 640
      height: 480
      fps: 30

# ========== Collision Detection ==========
collision_config:
  collision_threshold: 2.0
  detection_window: 5
  adaptive_mode: true
  velocity_compensation: true
  auto_calibrate: true
  calibration_samples: 20

# ========== Monitoring ==========
monitoring_config:
  log_level: "INFO"
  enable_prometheus: false
  prometheus_port: 9090

# ========== Task Sequence ==========
# Each big cycle contains two sub-cycles with different trunk angles for placing.
# Sub-cycle 1: pickup_C → place_D (trunk_2=45°)
# Sub-cycle 2: pickup_C → place_D2 (trunk_2=38°)
# max_cycles repeats the entire 13-task sequence.

tasks:
  # ===== Sub-cycle 1 =====

  # 1. AGV moves to Station C
  - name: "agv_to_station_C"
    task_type: "agv"
    max_duration: 60.0
    max_retries: 2
    enabled: true
    agv_config:
      target_station: "AP10"
      wait_for_arrival: true
      arrival_timeout: 60.0
      arrival_tolerance: 0.3
      check_arm_safe_position: true
      retry_on_timeout: true
      retry_count: 2
      emergency_stop_on_error: true

  # 2. Pickup at Station C (approach → grip)
  - name: "pickup_at_station_C"
    task_type: "position_sequence"
    max_duration: 18.0
    max_retries: 1
    enabled: true
    steps:
      - name: "approach"
        position: pickup_C_approach
        max_duration: 10.0
        position_tolerance: 3.0
      - name: "grip"
        position: pickup_C_grip
        max_duration: 8.0
        position_tolerance: 3.0

  # 3. Arm returns to home after pickup
  - name: "arm_home_after_pickup_C"
    task_type: "position"
    max_duration: 10.0
    max_retries: 1
    enabled: true
    completion_criteria:
      type: "position"
      position: home_pickup_C
      position_tolerance: 3.0

  # 4. AGV moves to Station D
  - name: "agv_to_station_D"
    task_type: "agv"
    max_duration: 60.0
    max_retries: 2
    enabled: true
    agv_config:
      target_station: "AP11"
      wait_for_arrival: true
      arrival_timeout: 60.0
      arrival_tolerance: 0.3
      check_arm_safe_position: true
      retry_on_timeout: true
      retry_count: 2
      emergency_stop_on_error: true

  # 5. Place at Station D (approach → grip, trunk_2=45°)
  - name: "place_at_station_D"
    task_type: "position_sequence"
    max_duration: 13.0
    max_retries: 1
    enabled: true
    steps:
      - name: "approach"
        position: place_D_approach
        max_duration: 10.0
        position_tolerance: 3.0
      - name: "grip"
        position: place_D_grip
        max_duration: 3.0
        position_tolerance: 3.0

  # 6. Arm returns to home after place
  - name: "arm_home_after_place_D"
    task_type: "position"
    max_duration: 10.0
    max_retries: 1
    enabled: true
    completion_criteria:
      type: "position"
      position: home
      position_tolerance: 3.0

  # ===== Sub-cycle 2 =====

  # 7. AGV moves to Station C (second pickup)
  - name: "agv_to_station_C2"
    task_type: "agv"
    max_duration: 60.0
    max_retries: 2
    enabled: true
    agv_config:
      target_station: "AP10"
      wait_for_arrival: true
      arrival_timeout: 60.0
      arrival_tolerance: 0.3
      check_arm_safe_position: true
      retry_on_timeout: true
      retry_count: 2
      emergency_stop_on_error: true

  # 8. Pickup at Station C (same as sub-cycle 1)
  - name: "pickup_at_station_C2"
    task_type: "position_sequence"
    max_duration: 18.0
    max_retries: 1
    enabled: true
    steps:
      - name: "approach"
        position: pickup_C_approach
        max_duration: 10.0
        position_tolerance: 3.0
      - name: "grip"
        position: pickup_C_grip
        max_duration: 8.0
        position_tolerance: 3.0

  # 9. Arm returns to home after pickup
  - name: "arm_home_after_pickup_C2"
    task_type: "position"
    max_duration: 10.0
    max_retries: 1
    enabled: true
    completion_criteria:
      type: "position"
      position: home_pickup_C
      position_tolerance: 3.0

  # 10. AGV moves to Station D (second place)
  - name: "agv_to_station_D2"
    task_type: "agv"
    max_duration: 60.0
    max_retries: 2
    enabled: true
    agv_config:
      target_station: "AP11"
      wait_for_arrival: true
      arrival_timeout: 60.0
      arrival_tolerance: 0.3
      check_arm_safe_position: true
      retry_on_timeout: true
      retry_count: 2
      emergency_stop_on_error: true

  # 11. Place at Station D2 (approach → grip, trunk_2=38°)
  - name: "place_at_station_D2"
    task_type: "position_sequence"
    max_duration: 13.0
    max_retries: 1
    enabled: true
    steps:
      - name: "approach"
        position: place_D2_approach
        max_duration: 10.0
        position_tolerance: 3.0
      - name: "grip"
        position: place_D2_grip
        max_duration: 3.0
        position_tolerance: 3.0

  # 12. Arm returns to home after place
  - name: "arm_home_after_place_D2"
    task_type: "position"
    max_duration: 10.0
    max_retries: 1
    enabled: true
    completion_criteria:
      type: "position"
      position: home
      position_tolerance: 3.0

  # ===== Return to start position =====

  # 13. AGV returns to Station C for next cycle
  - name: "agv_return_to_station_C"
    task_type: "agv"
    max_duration: 60.0
    max_retries: 2
    enabled: true
    agv_config:
      target_station: "AP10"
      wait_for_arrival: true
      arrival_timeout: 60.0
      arrival_tolerance: 0.3
      check_arm_safe_position: true
      retry_on_timeout: true
      retry_count: 2
      emergency_stop_on_error: true

# ========== Cycle Execution Settings ==========
max_cycles: 5
cycle_delay: 3.0
enable_cycle_prompt: true
environment_dt: 1.0 / 30.0
observation_timeout: 5.0
action_timeout: 5.0
reset_duration: 3.0
reset_positions: {}