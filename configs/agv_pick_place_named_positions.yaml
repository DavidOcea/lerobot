    right_arm_joint_2: 2.0
    right_arm_joint_3: 0.5
    right_arm_joint_4: 56.6
    right_arm_joint_5: 2.0
    right_arm_joint_6: -13.9
    trunk_joint_1: 0.0
    trunk_joint_2: 0.0

  # --- Pickup at Station C ---
  pickup_C_approach:
    left_arm_joint_1: -24.3
    left_arm_joint_2: -4.0
    left_arm_joint_3: -0.5
    left_arm_joint_4: -58.6
    left_arm_joint_5: -2.0
    left_arm_joint_6: 4.0
    right_arm_joint_1: 22.3
    right_arm_joint_2: 4.0
    right_arm_joint_3: 0.5
    right_arm_joint_4: 58.6
    right_arm_joint_5: 2.0
    right_arm_joint_6: -4.0
    trunk_joint_1: 0.0
    trunk_joint_2: 0.0

  pickup_C_grip:
    left_arm_joint_1: -24.3
    left_arm_joint_2: -2.0
    left_arm_joint_3: -0.5
    left_arm_joint_4: -58.6
    left_arm_joint_5: -2.0
    left_arm_joint_6: 12.5
    right_arm_joint_1: 22.3
    right_arm_joint_2: 2.0
    right_arm_joint_3: 0.5
    right_arm_joint_4: 58.6
    right_arm_joint_5: 2.0
    right_arm_joint_6: -12.5
    trunk_joint_1: 0.0
    trunk_joint_2: 0.0

  # --- Place at Station D (sub-cycle 1: trunk_2=45°) ---
  place_D_approach:
    left_arm_joint_1: -65.3
    left_arm_joint_2: -2.0
    left_arm_joint_3: -0.5
    left_arm_joint_4: -37.6
    left_arm_joint_5: -2.0
    left_arm_joint_6: 13.9
