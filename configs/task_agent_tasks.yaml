# Task Agent Configuration
# Configuration for multi-step robotic task execution with collision detection

# Camera definitions (shared reference)
# Camera index mapping: 0=head, 2=left_wrist, 4=left_wrist2, 6=right_wrist, 8=right_wrist2
cameras:
  head_cam:
    type: opencv
    index: 0
    width: 640
    height: 480
    fps: 30
  left_wrist_cam:
    type: opencv
    index: 2
    width: 640
    height: 480
    fps: 30
  left_wrist_cam2:
    type: opencv
    index: 4
    width: 640
    height: 480
    fps: 30
  right_wrist_cam:
    type: opencv
    index: 6
    width: 640
    height: 480
    fps: 30
  right_wrist_cam2:
    type: opencv
    index: 8
    width: 640
    height: 480
    fps: 30

# Task sequence definition
tasks:
  # Task 1: Pick up short workpiece (uses RIGHT hand)
  # Cameras: head_cam, right_wrist_cam, right_wrist_cam2
  - name: "pick_short_workpiece"
    policy_path: "/path/to/act_model_short_piece"
    policy_type: "act"
    max_duration: 30.0  # Maximum execution time in seconds
    max_retries: 3  # Maximum retry attempts if task fails
    enabled: true
    cameras:
      - name: "head_cam"
        type: "opencv"
        index: 0
        width: 640
        height: 480
        fps: 30
      - name: "right_wrist_cam"
        type: "opencv"
        index: 6
        width: 640
        height: 480
        fps: 30
      - name: "right_wrist_cam2"
        type: "opencv"
        index: 8
        width: 640
        height: 480
        fps: 30
    completion_criteria:
      type: "composite"  # Use multiple conditions for completion detection
      conditions:
        - type: "force"
          joint_name: "left_arm_joint_7"  # Gripper joint
          force_threshold: 0.5  # Nm - confirms grip
        - type: "stability"
          stability_window: 10  # Number of steps to check
          stability_tolerance: 0.005  # Max position variance

  # Task 2: Place short workpiece on workstation (uses RIGHT hand)
  # Cameras: head_cam, right_wrist_cam, right_wrist_cam2
  - name: "place_short_workpiece"
    policy_path: "/path/to/act_model_place_short"
    policy_type: "act"
    max_duration: 30.0
    max_retries: 3
    enabled: true
    cameras:
      - name: "head_cam"
        type: "opencv"
        index: 0
        width: 640
        height: 480
        fps: 30
      - name: "right_wrist_cam"
        type: "opencv"
        index: 6
        width: 640
        height: 480
        fps: 30
      - name: "right_wrist_cam2"
        type: "opencv"
        index: 8
        width: 640
        height: 480
        fps: 30
    completion_criteria:
      type: "position"
      target_joint_positions:
        left_arm_joint_7: 0.2  # Gripper open position
      position_tolerance: 0.01  # radians

  # Task 3: Pick up long workpiece (uses LEFT hand)
  # Cameras: head_cam, left_wrist_cam, left_wrist_cam2
  - name: "pick_long_workpiece"
    policy_path: "/path/to/act_model_long_piece"
    policy_type: "act"
    max_duration: 30.0
    max_retries: 3
    enabled: true
    cameras:
      - name: "head_cam"
        type: "opencv"
        index: 0
        width: 640
        height: 480
        fps: 30
      - name: "left_wrist_cam"
        type: "opencv"
        index: 2
        width: 640
        height: 480
        fps: 30
      - name: "left_wrist_cam2"
        type: "opencv"
        index: 4
        width: 640
        height: 480
        fps: 30
    completion_criteria:
      type: "composite"
      conditions:
        - type: "force"
          joint_name: "left_arm_joint_7"
          force_threshold: 0.5
        - type: "stability"
          stability_window: 10
          stability_tolerance: 0.005

  # Task 4: Place long workpiece on workstation (uses LEFT hand)
  # Cameras: head_cam, left_wrist_cam, left_wrist_cam2
  - name: "place_long_workpiece"
    policy_path: "/path/to/act_model_place_long"
    policy_type: "act"
    max_duration: 30.0
    max_retries: 3
    enabled: true
    cameras:
      - name: "head_cam"
        type: "opencv"
        index: 0
        width: 640
        height: 480
        fps: 30
      - name: "left_wrist_cam"
        type: "opencv"
        index: 2
        width: 640
        height: 480
        fps: 30
      - name: "left_wrist_cam2"
        type: "opencv"
        index: 4
        width: 640
        height: 480
        fps: 30
    completion_criteria:
      type: "position"
      target_joint_positions:
        left_arm_joint_7: 0.2  # Gripper open position
      position_tolerance: 0.01

  # Task 5: Press green button to signal completion (uses RIGHT hand)
  # Cameras: head_cam, right_wrist_cam, right_wrist_cam2
  - name: "press_button"
    policy_path: "/path/to/act_model_button"
    policy_type: "act"
    max_duration: 15.0  # Shorter duration for simple task
    max_retries: 3
    enabled: true
    cameras:
      - name: "head_cam"
        type: "opencv"
        index: 0
        width: 640
        height: 480
        fps: 30
      - name: "right_wrist_cam"
        type: "opencv"
        index: 6
        width: 640
        height: 480
        fps: 30
      - name: "right_wrist_cam2"
        type: "opencv"
        index: 8
        width: 640
        height: 480
        fps: 30
    completion_criteria:
      type: "position"
      target_joint_positions:
        right_arm_joint_6: 0.0  # Return to neutral position
      position_tolerance: 0.02

# Robot configuration
robot_config:
  type: "supre_robot_follower"
  control_frequency: 30  # Must be int, not float
  prometheus_port: 8000
  max_relative_joint_move: 15.0
  joint_config_file: "config_supre_robot_joint.yaml"
  cameras:
    head_cam:
      type: "opencv"
      index: 0
      width: 480
      height: 640
      fps: 30
    left_wrist_cam:
      type: "opencv"
      index: 2
      width: 480
      height: 640
      fps: 30
    left_wrist_cam2:
      type: "opencv"
      index: 4
      width: 480
      height: 640
      fps: 30
    right_wrist_cam:
      type: "opencv"
      index: 6
      width: 480
      height: 640
      fps: 30
    right_wrist_cam2:
      type: "opencv"
      index: 8
      width: 480
      height: 640
      fps: 30

# Collision detection configuration
collision_config:
  # Detection thresholds
  collision_threshold: 2.0  # Nm - torque anomaly threshold
  detection_window: 5  # Consecutive steps above threshold

  # Advanced detection
  adaptive_mode: true  # Adjust threshold based on motion state
  velocity_compensation: true  # Compensate for inertial torques
  inertia_compensation_factor: 0.1  # Factor for inertia estimation

  # Per-joint thresholds (optional, overrides global threshold)
  joint_specific_thresholds:
    left_arm_joint_7: 1.0  # Lower threshold for gripper
    right_arm_joint_7: 1.0  # Lower threshold for gripper

  # Safety limits
  max_torque_limit: 5.0  # Absolute maximum torque (Nm)

  # Recovery settings
  recovery_strategy: "stop_and_retreat"  # "stop", "stop_and_retreat", "retry"
  recovery_retreat_distance: 0.05  # Radians to retreat after collision
  recovery_timeout: 5.0  # Seconds to wait for recovery

  # Calibration settings
  auto_calibrate: true
  calibration_samples: 100
  calibration_threshold: 0.1  # Torque variance threshold

  # Joint inertia parameters (for velocity compensation)
  joint_inertia:
    left_arm_joint_1: 0.5
    left_arm_joint_2: 0.4
    left_arm_joint_3: 0.3
    left_arm_joint_4: 0.2
    left_arm_joint_5: 0.1
    left_arm_joint_6: 0.05
    left_arm_joint_7: 0.02  # Gripper
    right_arm_joint_1: 0.5
    right_arm_joint_2: 0.4
    right_arm_joint_3: 0.3
    right_arm_joint_4: 0.2
    right_arm_joint_5: 0.1
    right_arm_joint_6: 0.05
    right_arm_joint_7: 0.02  # Gripper

# Monitoring configuration
monitoring_config:
  enable_prometheus: true
  prometheus_port: 8000
  log_level: "INFO"
  log_observations: false
  log_actions: false
  state_history_size: 1000

# Execution settings
environment_dt: 0.0333  # Control loop timestep (30 Hz)
observation_timeout: 5.0  # Seconds to wait for observations
action_timeout: 5.0  # Seconds to wait for actions
