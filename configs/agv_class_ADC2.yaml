# AGV Pick + YOLO Classify + Conditional Place (A → C or D)
#
# 流程:
#   1. AGV → A点
#   2. 拍照识别料片类型 (long/short, 基于 YOLO ONNX)
#   3. long → 长料片抓取 → AGV→C → 放置 (交替两个放置动作)
#      short → 短料片抓取 → AGV→D → 放置
#   4. 未识别 → 原地等待重试 (最多 10 次, 每次等 2s)
#   5. 返回A, 每轮重置长料片放置计数
#
# 依赖: pip install onnxruntime
# 模型: best.onnx (由 detection_model/runs/workpiece_yolo/weights/best.onnx)

