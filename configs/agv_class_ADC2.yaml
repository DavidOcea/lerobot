        position_tolerance: 3.0
      - name: "step_3"
        position: B_put_long_2
        max_duration: 1.5
        position_tolerance: 3.0
      - name: "step_4"
        position: B_put_long_3
        max_duration: 1.5
        position_tolerance: 3.0
      - name: "step_4_5"
        position: B_put_long_3_2
        max_duration: 1.5
        position_tolerance: 3.0
      - name: "step_5"
        position: B_put_long_4
        max_duration: 1.0
        position_tolerance: 3.0
      - name: "step_6"
        position: B_put_long_5
        max_duration: 1.5
        position_tolerance: 3.0
      - name: "step_7"
        position: B_put_long_home
        max_duration: 4.0
        position_tolerance: 3.0

  - name: "arm_home_after_place_long_1"
    task_type: "position"
    max_duration: 10.0
    max_retries: 1
