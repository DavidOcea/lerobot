      - name: "手臂下降"
        position: pickup_station_5_2
        max_duration: 2.0
        position_tolerance: 3.0
      - name: "手臂闭合"
        position: pickup_station_5_3
        max_duration: 2.0
        position_tolerance: 3.0
      - name: "夹爪闭合"
        position: pickup_station_5_4
        max_duration: 1.0
        position_tolerance: 3.0
      - name: "手臂抬起"
        position: pickup_station_5_5
        max_duration: 2.0
        position_tolerance: 3.0
      - name: "home"
        position: pickup_station_5_home
        max_duration: 2.0
        position_tolerance: 3.0

  - name: "arm_home_after_pickup_long2"
    task_type: "position"
    max_duration: 15.0
