    trunk_joint_2: 3.0

# ========== Robot Configuration ==========
robot_config:
  type: "supre_robot_follower"
  control_frequency: 50
  prometheus_port: 8000
  max_relative_joint_move: 2.0
  joint_config_file: "trunk_config_supre_robot_joint.yaml"
  cameras:
    head_cam:
      type: opencv
      index: 0
      width: 640
      height: 480
      fps: 30
    left_wrist_cam:
      type: opencv
      index: 2
      width: 640
      height: 480
      fps: 30
    right_wrist_cam:
      type: opencv
      index: 4
      width: 640
      height: 480
      fps: 30

# ========== Collision Detection ==========
collision_config:
  collision_threshold: 2.0
  detection_window: 5
  adaptive_mode: true
  velocity_compensation: true
  auto_calibrate: true
  calibration_samples: 20

# ========== Monitoring ==========
monitoring_config:
  log_level: "INFO"
  enable_prometheus: false
  prometheus_port: 9090

# ========== Task Sequence ==========
# 流程:
#   AGV→A → 分类(头部相机) → long/short 分支
#     long: 长料片抓取 → arm_home → AGV→C → 放置(long_1 或 long_2交替)
#     short: 短料片抓取 → arm_home → AGV→D → 短放置
#   未识别 → 原地等待重试
#   → 返回A (cycle_end)
#
# 长料片放置每次循环交替:
#   第1次 long → long_1 (放长料片)
#   第2次 long → long_2 (放长料片2)
#   每轮大循环重置计数

tasks:
  # ---- Step 1: AGV到A点 ----
  - name: "agv_to_station_A"
    task_type: "agv"
    max_duration: 60.0
    max_retries: 2
    enabled: true
    agv_config:
      target_station: "LM8"
      wait_for_arrival: true
      arrival_timeout: 60.0
      arrival_tolerance: 0.3
      check_arm_safe_position: false
      retry_on_timeout: true
      retry_count: 2
      emergency_stop_on_error: true

  # ---- Step 2: 拍照识别料片类型 (条件分支) ----
  # YOLO ONNX 检测 → label="long" 或 "short"
  # 未识别 → 原地等待重试 (最多 10 次, 每次 2s)
  # label_counter 把 long 自动标记为 long_1 / long_2 (交替)
  - name: "classify_workpiece"
    task_type: "classify"
    max_duration: 30.0
    max_retries: 1
    enabled: true
    cameras:
      - name: "head_cam"
        type: "opencv"
        index: 0
        width: 640
        height: 480
        fps: 30
    classify_config:
      method: "yolo_detect"
      model_path: "/home/t/workspace/gitprj/lerobot/../detection_model/runs/workpiece_yolo/weights/best.onnx"
      classes: ["short", "long"]
      default_label: "unknown"
      # 未识别 → 原地等待重试
      retry_on_no_detect: true
      retry_wait_seconds: 2.0
      retry_max_attempts: 10
      # 长料片交替放置计数
      label_counter_enable: true
      counter_keywords: ["long"]
      counter_modulo: 2           # long_1 → long_2 → long_1 → ... 循环
    next_tasks:
      long_1: "pickup_long"       # 第1次长料片 → 长抓取 → C点放置1
      long_2: "pickup_long2"      # 第2次长料片 → 长抓取 → C点放置2
      short: "pickup_short"       # 短料片 → 短抓取 → D点

  # === 长料片分支 ===

  # 长料片抓取 (第1次放置)
  - name: "pickup_long"
    task_type: "position_sequence"
    max_duration: 20.0
    max_retries: 1
    enabled: true
    steps:
      - name: "手臂摊开"
        position: pickup_station_5_1
        max_duration: 2.0
        position_tolerance: 3.0
      - name: "手臂下降"
        position: pickup_station_5_2
        max_duration: 2.0
        position_tolerance: 3.0
      - name: "手臂闭合"
        position: pickup_station_5_3
        max_duration: 2.0
        position_tolerance: 3.0
      - name: "夹爪闭合"
        position: pickup_station_5_4
        max_duration: 1.0
        position_tolerance: 3.0
      - name: "手臂抬起"
        position: pickup_station_5_5
        max_duration: 2.0
        position_tolerance: 3.0
      - name: "home"
        position: pickup_station_5_home
        max_duration: 2.0
        position_tolerance: 3.0

  - name: "arm_home_after_pickup_long"
    task_type: "position"
    max_duration: 15.0
    max_retries: 1
    enabled: true
    completion_criteria:
      type: "position"
      position: home
      position_tolerance: 2.0

  - name: "agv_to_station_C"
    task_type: "agv"
    max_duration: 60.0
    max_retries: 2
    enabled: true
    agv_config:
      target_station: "AP10"
      wait_for_arrival: true
      arrival_timeout: 60.0
      arrival_tolerance: 0.3
      check_arm_safe_position: true
      retry_on_timeout: true
      retry_count: 2
      emergency_stop_on_error: true

  # 长料片放置1 (第1次)
  - name: "place_long_1"
    task_type: "position_sequence"
    max_duration: 16.0
    max_retries: 1
    enabled: true
    steps:
      - name: "step_1"
        position: B_put_long_0
