# Task Agent Configuration - Test/Demo Version
# This is a minimal configuration for testing the task agent system

# Camera definitions
cameras:
  head_cam:
    type: opencv
    index: 0
    width: 640
    height: 480
    fps: 30
  left_wrist_cam:
    type: opencv
    index: 2
    width: 640
    height: 480
    fps: 30
  left_wrist_cam2:
    type: opencv
    index: 4
    width: 640
    height: 480
    fps: 30
  right_wrist_cam:
    type: opencv
    index: 6
    width: 640
    height: 480
    fps: 30
  right_wrist_cam2:
    type: opencv
    index: 8
    width: 640
    height: 480
    fps: 30

# Task sequence definition
tasks:
  # Task 1: Simple movement test (uses RIGHT hand cameras)
  - name: "test_movement"
    policy_path: "/home/smai/dc_dir/lerobot_0901_pybullet/outputs/train/act_1121_3/checkpoints/last/pretrained_model"
    policy_type: "act"
    max_duration: 10.0
    max_retries: 2
    enabled: true
    cameras:
      - name: "head_cam"
        type: "opencv"
        index: 0
        width: 640
        height: 480
        fps: 30
      - name: "right_wrist_cam"
        type: "opencv"
        index: 6
        width: 640
        height: 480
        fps: 30
      - name: "right_wrist_cam2"
        type: "opencv"
        index: 8
        width: 640
        height: 480
        fps: 30
    completion_criteria:
      type: "stability"
      stability_window: 5
      stability_tolerance: 0.01

# Robot configuration
robot_config:
  type: "supre_robot_follower"
  config_path: null
  camera_enabled: true
  force_sensing_enabled: true
  control_frequency: 30.0

# Collision detection configuration
collision_config:
  collision_threshold: 2.0
  detection_window: 3
  adaptive_mode: true
  velocity_compensation: true
  recovery_strategy: "stop_and_retreat"
  recovery_retreat_distance: 0.05
  auto_calibrate: true
  calibration_samples: 50

# Monitoring configuration
monitoring_config:
  enable_prometheus: false  # Disabled for testing
  prometheus_port: 8000
  log_level: "DEBUG"
  log_observations: false
  log_actions: false
  state_history_size: 100

# Execution settings
environment_dt: 0.0333
observation_timeout: 5.0
action_timeout: 5.0
