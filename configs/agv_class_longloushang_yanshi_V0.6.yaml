#
# 流程:
#   1. AGV → A点 (LM16)
#   2. 视觉对齐 (AprilTag)
#   3. 拍照识别料片类型 + 位置:
#      - long + ROI匹配 → 对应点位抓取 (pickup_at_station_XX)
#      - short/box/no_detection → 语音"未检测到料片" → 每10s重试 → 2min超时 → 回到起点
