    enabled: true
    agv_config:
      target_station: "LM16"
      wait_for_arrival: true
      arrival_timeout: 60.0
      arrival_tolerance: 0.3
      check_arm_safe_position: false
      retry_on_timeout: true
      retry_count: 2
      emergency_stop_on_error: true


# ========== Cycle Execution Settings ==========
max_cycles: -1          # 无限循环, 成功抓取后 cycle_end 才结束
cycle_delay: 1.0
enable_cycle_prompt: true
environment_dt: 1.0 / 30.0
observation_timeout: 5.0
action_timeout: 5.0
reset_duration: 3.0
reset_positions: {}

# ========== Phase 3/4 opt-in keys (offline LLM + visual detector test fixture) ==========
planner: llm
llm:
  model: fake-model
  base_url: "http://127.0.0.1:9999/v1"
  api_key: fake-key
  max_tool_calls: 6
  temperature: 0.0
  timeout: 60.0
visual_detector:
  enabled: true
  method: baseline_diff
  camera_key: head_cam
  pixel_threshold: 30
  diff_threshold: 0.05
  direction: decrease
  settle_delay: 0.5
