# === harness vla: task memory===
task_memory_config:
  enabled: true
  store_path: "/home/t/workspace/dc_dir/.task_memory.json"

# ========== AGV Global Configuration ==========
agv_config:
  enabled: true
  host: "192.168.2.13"
  port: 19204
  connection_timeout: 5.0
  read_timeout: 2.0
  auto_reconnect: true
  auto_disconnect_after_task: false
  emergency_stop_enabled: true
  check_arm_before_move: true
  station_map:
    station_A: [0.168, 0.029, 0.650]
  default_arm_safe_positions: {left_arm_joint_1: 5.0, left_arm_joint_2: 5.0, left_arm_joint_3: 5.0, left_arm_joint_4: 5.0, left_arm_joint_5: 5.0, left_arm_joint_6: 5.0, right_arm_joint_1: 5.0, right_arm_joint_2: 5.0, right_arm_joint_3: 5.0, right_arm_joint_4: 5.0, right_arm_joint_5: 5.0, right_arm_joint_6: 5.0, trunk_joint_1: 3.0, trunk_joint_2: 3.0}
  default_arm_home_positions: {left_arm_joint_1: -77.9, left_arm_joint_2: -9.8, left_arm_joint_3: -0.5, left_arm_joint_4: -28.0, left_arm_joint_5: -93.0, left_arm_joint_6: -85.0, left_arm_joint_7: 0.0, right_arm_joint_1: 76.3, right_arm_joint_2: 9.8, right_arm_joint_3: 0.05, right_arm_joint_4: 28.0, right_arm_joint_5: 93.0, right_arm_joint_6: 85.0, trunk_joint_1: 0.0, trunk_joint_2: 0.0}

# ========== Robot Configuration ==========
robot_config:
  type: "supre_robot_follower"
  control_frequency: 50
  prometheus_port: 8000
  max_relative_joint_move: 5.0
  robot_profile: profiles/robot2_trunk.yaml
  joint_config_file: "trunk_config_supre_robot_joint.yaml"
  cameras:
    head_cam: {type: opencv, index: 0, width: 640, height: 480, fps: 30}
    left_wrist_cam: {type: opencv, index: 2, width: 640, height: 480, fps: 30}
    right_wrist_cam: {type: opencv, index: 4, width: 640, height: 480, fps: 30}

# ========== Collision Detection ==========
collision_config:
  collision_threshold: 2.0
  detection_window: 5
  adaptive_mode: true
  velocity_compensation: true
  auto_calibrate: true
  calibration_samples: 20

# ========== Monitoring ==========
monitoring_config:
  log_level: "INFO"
  enable_prometheus: false
  prometheus_port: 9090

# ========== Task Sequence ==========
tasks:
  # Step 1: AGV到A点
  - name: "agv_to_station_A"
    task_type: "agv"
    max_duration: 60.0
    max_retries: 2
    enabled: true
    agv_config:
      target_station: "LM16"
      wait_for_arrival: true
      arrival_timeout: 60.0
      arrival_tolerance: 0.3
      check_arm_safe_position: false
      retry_on_timeout: true
      retry_count: 2
      emergency_stop_on_error: true

  # Step 2: 视觉对齐
  - name: "align_to_tag"
    task_type: "visual_align"
    max_duration: 60.0
    max_retries: 2
    stop_on_failure: false
    next_tasks:
      success: "classify_workpiece"
      failed: "voice_align_failed"
    visual_align_config:
      marker_id: 0
      tag_1_id: 1
      marker_size: 0.18
      tag_1_size: 0.18
      marker_family: "tag36h11"
      search_turn_step: 30.0
      search_max_turn: 360.0
      search_max_attempts: 99
      max_iterations: 10
      position_tolerance: 0.01
      angle_tolerance: 1.0
      # AGV 运动模式: 0=里程(默认, 平移不锁航向易横向漂移), 1=定位(激光/二维码闭环, 需 AGV 已定位稳定)
      turn_mode: 0            # 转动保持里程模式(诊断已证转动超调仅 ~14%, 无漂移) 1基于地图闭环定位 0仅基于里程
      translate_mode: 1       # 平移切定位模式(锁航向, 防 tag 从左甩到右) ← 本次改动 1基于地图闭环定位 0仅基于里程
      # alignment_mode: "freego"   # ← 新增
      # stop_between_turn_and_forward: true   # ← 加这一行
      reference_pose_path: "/home/t/workspace/gitprj/lerobot/ref_station_2_2.json"
      distance_offset: 0.0
      camera_offset_x: 0.061
      camera_offset_y: -0.018
      camera_offset_pitch: 40.0
      camera_matrix: [392.163, 0.0, 331.139, 0.0, 392.655, 201.662, 0.0, 0.0, 1.0]
      dist_coeffs: [-0.410230, 0.191873, -0.001411, -0.003197, -0.050031]

  # 对齐失败
  - name: "voice_align_failed"
    task_type: "system_command"
    command: "python /home/t/workspace/dc_dir/tts_cache/speak.py '无法对齐，请调整工作台位置'"

  - name: "agv_retreat_align"
    task_type: "agv"
    agv_config: {translate_dist: 0.30, translate_vx: -0.10, check_arm_safe_position: false}
    cycle_end: true

  # Step 3: YOLO+ROI拍照识别 (long料片 → 12点位匹配)
  - name: "classify_workpiece"
    task_type: "classify"
    max_duration: 450.0      # 最多7.5分钟 (retry 30次 × 10s + 语音)
    max_retries: 1
    enabled: true
    classify_config:
      method: "yolo_roi"
      model_path: "/home/t/workspace/dc_dir/models/yolov8n/best.onnx"
      classes: ["short", "long", "box"]
      default_label: "unknown"
      # Retry on ANY non-long label, TTS before each retry
      retry_on_no_detect: true
      retry_labels: ["short", "box", "unknown", "no_detection"]
      retry_wait_seconds: 10.0
